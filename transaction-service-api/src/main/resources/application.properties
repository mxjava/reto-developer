spring.application.name=transaction-service-api
server.port=8082
server.shutdown=graceful

spring.datasource.url=jdbc:h2:mem:transactionsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${H2_DB_USERNAME:sa}
spring.datasource.password=${H2_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 local/demo access. Disabled unless Start-Demo enables it explicitly.
spring.h2.console.enabled=${APP_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
app.h2.tcp.enabled=${APP_H2_TCP_ENABLED:false}
app.h2.tcp.port=${APP_H2_TCP_PORT:9092}

security.jwt.secret-base64=${SECURITY_JWT_SECRET_BASE64}
security.jwt.issuer=${SECURITY_JWT_ISSUER:reto-developer-local}
security.jwt.audience=${SECURITY_JWT_AUDIENCE:transaction-api}
security.jwt.ttl-minutes=${SECURITY_JWT_TTL_MINUTES:15}

app.bootstrap.username=${APP_BOOTSTRAP_USERNAME:}
app.bootstrap.password=${APP_BOOTSTRAP_PASSWORD:}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Hardening HTTP
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=16KB
